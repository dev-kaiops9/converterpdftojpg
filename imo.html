<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMO — PDF Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4F46E5;
    --primary-dark:#4338CA;
    --primary-light:#EEF2FF;
    --bg:#F5F6FB;
    --card:#FFFFFF;
    --ink:#181B34;
    --ink-soft:#6B7099;
    --ink-faint:#9296B5;
    --border:#E7E8F2;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .page{ max-width:840px; margin:0 auto; }
  .topbar{ display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .logo{
    width:38px;height:38px; border-radius:10px;
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-weight:800; font-size:13px; letter-spacing:-0.02em; flex-shrink:0;
  }
  .brand-name{ font-weight:800; font-size:17px; letter-spacing:-0.01em; color:var(--ink); }
  .brand-tag{ font-size:12px; color:var(--ink-faint); margin-top:1px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; color:var(--ink-soft);
    text-decoration:none; margin-bottom:20px;
  }
  .back-link:hover{ color:var(--primary); }
  .back-link svg{ width:16px; height:16px; }

  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:60px 24px;
    text-align:center;
  }
  .panel-icon{
    width:56px;height:56px;
    border-radius:14px;
    background:var(--primary-light);
    color:var(--primary);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
  }
  .panel-icon svg{ width:26px; height:26px; }
  .panel h1{ font-size:19px; font-weight:800; margin:0 0 8px; letter-spacing:-0.01em; }
  .panel p{ font-size:13.5px; color:var(--ink-faint); margin:0; max-width:360px; margin:0 auto; line-height:1.6; }
</style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <div class="logo">PH</div>
    <div>
      <div class="brand-name">PDF Hub</div>
      <div class="brand-tag">Built by 69451</div>
    </div>
  </div>

  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    Kembali ke Beranda
  </a>

  <div class="panel">
    <div class="panel-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <h1>Menu IMO</h1>
    <p>Halaman ini sedang dalam pengembangan dan akan segera tersedia.</p>
  </div>

</div>

</body>
</html>
